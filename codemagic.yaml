workflows:
  # Workflow pour générer l'APK / AAB Android
  android-workflow:
    name: Build Android (TILA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
      java: 17
    scripts:
      - name: Installer les dépendances npm
        script: |
          npm install --legacy-peer-deps
      - name: Préparer le projet Expo (Prebuild)
        script: |
          npx expo prebuild --platform android --clean
      - name: Compiler le package Android (Release APK)
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  # Workflow pour compiler pour iOS (Simulator ou Device)
  ios-workflow:
    name: Build iOS (TILA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installer les dépendances npm
        script: |
          npm install --legacy-peer-deps
      - name: Préparer le projet Expo (Prebuild)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Installer les Pods CocoaPods
        script: |
          cd ios
          pod install
      - name: Compiler l'application iOS (Debug/Simulator ou Unsigned Release)
        script: |
          xcodebuild build \
            -workspace ios/TILA.xcworkspace \
            -scheme TILA \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - build/Build/Products/Release-iphoneos/*.ipa
