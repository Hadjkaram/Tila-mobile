workflows:
  ios-workflow:
    name: Build & Deploy iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic TILA   # Le nom de votre intégration dans Codemagic
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "ci.tila.app"
    scripts:
      - name: Installer les dépendances npm
        script: |
          npm install --legacy-peer-deps

      - name: Préparer le projet Expo (Prebuild)
        script: |
          npx expo prebuild --platform ios --clean

      - name: Installer les Pods CocoaPods
        script: |
          cd ios
          pod install

      - name: Créer et récupérer le certificat et profil de distribution Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "ios/TILA.xcodeproj"

      - name: Compiler le package iOS signé (.IPA)
        script: |
          xcode-project build-ipa \
            --workspace "ios/TILA.xcworkspace" \
            --scheme "TILA"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
