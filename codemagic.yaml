workflows:
  ios-workflow:
    name: Build & Deploy iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic TILA
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ci.tila.app
      vars:
        BUNDLE_ID: "ci.tila.app"
        EXPO_PUBLIC_API_URL: "https://apiv2.tila.ci"
    scripts:
      - name: Configurer l'environnement de production
        script: |
          echo "EXPO_PUBLIC_API_URL=https://apiv2.tila.ci" > .env
      - name: Installer les dépendances npm
        script: |
          npm install --legacy-peer-deps

      - name: Préparer le projet Expo (Prebuild)
        script: |
          echo "EXPO_PUBLIC_API_URL=https://apiv2.tila.ci" > .env
          npx expo prebuild --platform ios --clean

      - name: Incrémenter automatiquement le numéro de build
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "")
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            NEXT_BUILD_NUMBER=$((${BUILD_NUMBER:-1} + 2))
          else
            NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi
          if [ "$NEXT_BUILD_NUMBER" -lt 3 ]; then
            NEXT_BUILD_NUMBER=3
          fi
          echo "Prochain numéro de build TestFlight: $NEXT_BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD_NUMBER" ios/TILA/Info.plist || true
          cd ios
          agvtool new-version -all $NEXT_BUILD_NUMBER

      - name: Installer les Pods CocoaPods
        script: |
          cd ios
          pod install

      - name: Appliquer les profils de signature
        script: |
          xcode-project use-profiles --project ios/TILA.xcodeproj

      - name: Compiler le package iOS signé (.IPA)
        script: |
          xcode-project build-ipa \
            --workspace "ios/TILA.xcworkspace" \
            --scheme "TILA"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
